# Two processes, two tokens, one image.
#
# Workers are NOT started from here: the owner panel provisions them on remote
# servers over SSH + Docker. A worker service is intentionally absent so nobody
# accidentally runs a worker on the master with the master's own .env.
services:
  owner:
    build: .
    image: makemyno
    container_name: makemyno-owner
    restart: always
    env_file: .env
    environment:
      MODE: owner
    volumes:
      - ./data:/app/data

  customer:
    build: .
    image: makemyno
    container_name: makemyno-customer
    restart: always
    env_file: .env
    environment:
      MODE: customer
    volumes:
      # The same data directory on purpose: both processes share customer.db
      # (WAL + busy_timeout make concurrent access safe) and the sessions folder.
      - ./data:/app/data
    depends_on:
      - owner
